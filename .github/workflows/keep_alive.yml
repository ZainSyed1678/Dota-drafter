name: Keep Alive Ping (24/7 Bot & Backend Uptime)

on:
  schedule:
    # Runs every 12 minutes to prevent Render free-tier from sleeping (15-min timeout)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend & Telegram Bot
        run: |
          echo "Sending keep-alive pulse to Render..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://dota-drafter-api.onrender.com/health)
          echo "Pulse status code: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "SUCCESS: Render backend and Telegram supervisor bot are awake and running 24/7!"
          else
            echo "WARNING: Received status $STATUS. Retrying root endpoint..."
            curl -s --max-time 30 https://dota-drafter-api.onrender.com/ || true
          fi

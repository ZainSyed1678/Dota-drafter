name: Daily Match Collection & Retrain Pipeline

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  daily-retrain:
    name: Collect Matches & Retrain Model
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Collection & Retraining Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKEND_URL: https://dota-drafter-api.onrender.com
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: |
          python scripts/daily_pipeline.py --patch 7.35f --max-calls 1500 --max-samples 100000 --exhaust-api

      - name: Commit and Push Updated Model Weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/model/ model/
          if git diff --staged --quiet; then
            echo "No model changes detected to commit."
          else
            git commit -m "chore(model): daily automated retrain [skip ci]"
            git push origin main
          fi

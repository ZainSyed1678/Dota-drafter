version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dota_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DIR=/app/model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dota_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: dota_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dota_net

  prometheus:
    image: prom/prometheus:latest
    container_name: dota_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dota_net

  grafana:
    image: grafana/grafana:latest
    container_name: dota_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - dota_net

  postgres:
    image: postgres:15-alpine
    container_name: dota_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotauser
      POSTGRES_PASSWORD: dotapassword
      POSTGRES_DB: dotadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dota_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dota_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dota_net

  supervisor_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: dota_supervisor_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - BACKEND_URL=http://backend:8000
      - PROMETHEUS_URL=http://prometheus:9090
      - QDRANT_URL=http://qdrant:6333
    networks:
      - dota_net

networks:
  dota_net:
    driver: bridge

volumes:
  pgdata:
  qdrant_data:

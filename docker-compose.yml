version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Dota 2 Drafter — Multi-container setup
#
# Services:
#   backend   — FastAPI (Python) serving the suggest API on port 8000
#   frontend  — Vite + React served via Nginx on port 3000
#   scheduler — Automated data collection and model retraining (every 6 hours)
#
# Usage:
#   docker compose up --build          # first time or after code changes
#   docker compose up                  # subsequent starts (< 5 seconds)
#   docker compose down                # stop everything
#   docker compose logs backend        # view API logs
#   docker compose logs frontend       # view nginx logs
#   docker compose logs scheduler      # view scheduler logs
#
# The pkl model files live in ./model/ on the HOST and are mounted
# read-only into the backend container.  Retrain in the notebook,
# then just restart the backend — no rebuild needed.
#   docker compose restart backend
#
# The scheduler automatically checks for Dota 2 patches every 6 hours,
# collects fresh match data, and retrains the model when a new patch is detected.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API (FastAPI + LightGBM) ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dota_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount the model directory so you can retrain without rebuilding
      - ./model:/app/model:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DIR=/app/model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dota_net

  # ── Frontend (React/Vite built → Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Injected at build time so the JS bundle knows the API URL
        VITE_API_URL: http://localhost:8000
    container_name: dota_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dota_net

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: dota_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dota_net

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: dota_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - dota_net

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: dota_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotauser
      POSTGRES_PASSWORD: dotapassword
      POSTGRES_DB: dotadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dota_net

networks:
  dota_net:
    driver: bridge

volumes:
  pgdata: